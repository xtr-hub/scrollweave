name: Python / Rust core
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.17.3
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: cargo test --workspace --locked
      - run: python -m pip install .
      - run: python -m pip check
      - run: python tools/smoke_test.py
      - run: python -m unittest discover -s tests/python -v
      - run: python -m scrollweave --help
      - run: python -m scrollweave --version
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install auditwheel
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: auditwheel repair dist/*.whl -w wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: scrollweave-manylinux-wheel
          path: wheelhouse/*.whl
